[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zyle-learning"
version = "0.1.0"
description = "Isolated, layout-general Breakout reinforcement-learning environment"
requires-python = ">=3.11"
dependencies = [
    "gymnasium==1.3.0",
    "numpy==2.5.1",
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
    "torch==2.13.0+cu126",
]

[tool.setuptools.packages.find]
include = ["zl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
